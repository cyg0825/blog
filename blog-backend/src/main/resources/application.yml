spring:
  profiles:
    active: h2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:BlogSystemSecretKeyChangeMe}
  expiration: 86400000

ai:
  api-url: ${AI_API_URL:https://token.sensenova.cn/v1/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:sensenova-6.7-flash-lite}

# 文件上传路径配置
file:
  upload:
    path: ./files

logging:
  level:
    com.blog: INFO
    org.springframework.security: WARN